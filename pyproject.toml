[project]
name = "canada_labour_api"
version = "0.1.0"
   description = "A FastAPI service in front of Statistics Canada's labour force data (work in progress)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "tenacity>=9.2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]